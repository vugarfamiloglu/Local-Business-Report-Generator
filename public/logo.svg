<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- A tally-mark glyph (||||) framed by a bond-paper corner -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1a2332"/>
      <stop offset="0.6" stop-color="#1e3a8a"/>
      <stop offset="1"   stop-color="#b08a40"/>
    </linearGradient>
  </defs>
  <!-- folded-corner bond paper -->
  <path d="M14 8 H44 L56 20 V56 H14 Z" stroke="url(#g)" stroke-width="2.2" fill="#fbfaf6"/>
  <path d="M44 8 V20 H56" stroke="url(#g)" stroke-width="2.2" fill="none"/>
  <!-- tally marks: four verticals + one cross -->
  <line x1="22" y1="30" x2="22" y2="48" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="28" y1="30" x2="28" y2="48" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="34" y1="30" x2="34" y2="48" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="40" y1="30" x2="40" y2="48" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the diagonal cross that marks the fifth -->
  <line x1="18" y1="46" x2="44" y2="32" stroke="#b08a40" stroke-width="2.6" stroke-linecap="round"/>
</svg>
